name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build
        run: npm run build

      - name: Run tests (if available)
        run: npm test --if-present
        continue-on-error: true

  deploy:
    name: Deploy to AWS Staging
    runs-on: ubuntu-latest
    needs: test
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff (Review changes)
        run: |
          cd infra
          ENVIRONMENT=staging npx cdk diff || true

      - name: Deploy Storage Stack
        run: npm run cdk:deploy:staging -- SaasBackend-Storage-staging

      - name: Deploy Lambda Stack
        run: npm run cdk:deploy:staging -- SaasBackend-Lambda-staging

      - name: Deploy API Stack
        run: npm run cdk:deploy:staging -- SaasBackend-Api-staging

      - name: Deploy Monitoring Stack
        run: npm run cdk:deploy:staging -- SaasBackend-Monitoring-staging

      - name: Get API URL
        id: api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name SaasBackend-Api-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "url=$API_URL" >> $GITHUB_OUTPUT
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # Add your smoke tests here
          curl -f ${{ steps.api-url.outputs.url }}health || echo "Health check endpoint not implemented yet"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment to Staging environment completed successfully!"
          echo "API URL: ${{ steps.api-url.outputs.url }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment to Staging environment failed!"
          exit 1
