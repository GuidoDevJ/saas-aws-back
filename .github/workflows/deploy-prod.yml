name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        default: ''

env:
  AWS_REGION: us-west-2
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Deployment cancelled. You must type 'DEPLOY' to confirm."
            exit 1
          fi
          echo "✅ Deployment confirmed"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test --if-present

  deploy:
    name: Deploy to AWS Production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff (Review changes)
        run: |
          cd infra
          ENVIRONMENT=prod npx cdk diff || true

      - name: Create backup snapshot (DynamoDB)
        run: |
          echo "Creating DynamoDB backup..."
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          aws dynamodb create-backup \
            --table-name Items \
            --backup-name "pre-deploy-backup-$TIMESTAMP" || echo "Backup failed, continuing..."

      - name: Deploy Storage Stack
        run: npm run cdk:deploy:prod -- SaasBackend-Storage-prod

      - name: Deploy Lambda Stack
        run: npm run cdk:deploy:prod -- SaasBackend-Lambda-prod

      - name: Deploy API Stack
        run: npm run cdk:deploy:prod -- SaasBackend-Api-prod

      - name: Deploy Monitoring Stack
        run: npm run cdk:deploy:prod -- SaasBackend-Monitoring-prod

      - name: Get API URL
        id: api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name SaasBackend-Api-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "url=$API_URL" >> $GITHUB_OUTPUT
          echo "### Production Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production..."
          # Add your smoke tests here
          curl -f ${{ steps.api-url.outputs.url }}health || echo "Health check endpoint not implemented yet"

      - name: Wait for warmup
        run: |
          echo "Waiting 30 seconds for Lambda warmup..."
          sleep 30

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Add verification checks here
          echo "✅ Deployment verified"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment to Production completed successfully!"
          echo "API URL: ${{ steps.api-url.outputs.url }}"
          echo "🎉 Production is live!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Consider rolling back..."
          echo "Run: npm run cdk:destroy:prod"
          exit 1
